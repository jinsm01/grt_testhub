apifox_check:
  project_id: ""
  environment_id: ""
  access_token: ""
  thresholds:
    max_steps_per_scenario: 10
    max_wait_ms: 5000
  rules:
    - id: scenario-run-passed
      name: "场景运行通过"
      severity: high
      enabled: true
      description: "检查场景最近一次运行是否通过"
      check: check_scenario_run_passed

    - id: scenario-step-count
      name: "单场景步骤数不超过10步"
      severity: mid
      enabled: true
      description: "检查单个测试场景步骤数是否超过10步（不包含引用其他场景或分组的步骤）"
      check: check_scenario_step_count
      params:
        max_steps: 10

    - id: crud-query-assert
      name: "增删改后查询断言"
      severity: high
      enabled: true
      description: "增删改(POST/PUT/DELETE/PATCH)操作后是否/search查询步骤并使用断言校验"
      check: check_crud_query_assert

    - id: no-hardcoded-id
      name: "Id参数不能写死"
      severity: high
      enabled: true
      description: "检查步骤请求body中带有Id的参数是否硬编码而非使用变量"
      check: check_no_hardcoded_id

    - id: param-from-prev-step
      name: "参数来源校验"
      severity: high
      enabled: true
      description: "检查后续步骤用到的参数是否从前置步骤中或变量获取，而非硬编码"
      check: check_param_from_prev_step

    - id: auto-name-tag
      name: "名称参数自动化标识"
      severity: high
      enabled: true
      description: "检查POST/PUT步骤中name/title等字段是否含'自动化'标识且为动态值（提取token步骤除外）"
      check: check_auto_name_tag
      params:
        required_tag: "自动化"

    - id: fixture-dir-skip
      name: "前置后置目录跳过统计"
      severity: skip
      enabled: true
      description: "前置/后置目录下的场景不参与校验统计"
      check: check_fixture_dir_skip
